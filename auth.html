<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ingreso y registro de usuarios para MAPA VIDEO CLUB." />
    <title>MAPA VIDEO CLUB | Ingresar</title>
    <link rel="icon" type="image/png" href="assets/img/logo-mapa-video-club-icon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-body">
    <header class="site-header">
      <nav class="navbar navbar-dark app-navbar">
        <div class="container">
          <a class="navbar-brand brand-mark" href="index.html" aria-label="MAPA VIDEO CLUB">
            <img src="assets/img/logo-mapa-video-club.png" alt="MAPA VIDEO CLUB" class="brand-logo" />
          </a>
          <div class="navbar-actions">
            <a class="nav-icon-link d-none" href="index.html?view=favorites" aria-label="Ver mis favoritas" data-favorites-nav>
              <img src="assets/img/icon-favorite-neon.png" alt="Favoritos" class="nav-icon-img" />
            </a>
            <a class="nav-icon-link cart-nav-link" href="#" aria-label="Abrir carrito" data-cart-open>
              <img src="assets/img/icon-cart-neon.png" alt="Carrito" class="nav-icon-img" />
              <span class="cart-count-badge d-none" data-cart-count>0</span>
            </a>
            <div class="auth-nav" data-auth-nav>
              <a class="nav-icon-link" href="auth.html" aria-label="Ir a usuario">
                <img src="assets/img/icon-user-neon.png" alt="Usuario" class="nav-icon-img" />
              </a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-section">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">
              <article class="auth-panel">
                <div class="auth-panel-header">
                  <span class="section-tag">Socios del videoclub</span>
                  <h1 class="section-title">Ingresa a tu cuenta</h1>
                </div>

                <div class="auth-toggle" role="tablist" aria-label="Autenticacion">
                  <button
                    class="auth-toggle-button is-active"
                    id="auth-login-toggle"
                    type="button"
                    role="tab"
                    aria-selected="true"
                  >
                    Login
                  </button>
                  <button
                    class="auth-toggle-button"
                    id="auth-register-toggle"
                    type="button"
                    role="tab"
                    aria-selected="false"
                  >
                    Registro
                  </button>
                </div>

                <section id="login-panel" role="tabpanel" aria-labelledby="auth-login-toggle">
                  <form class="auth-form" id="login-form" novalidate>
                    <div>
                      <label class="form-label" for="login-email">Correo</label>
                      <input
                        class="form-control app-input"
                        id="login-email"
                        type="email"
                        autocomplete="email"
                        placeholder="correo@ejemplo.com"
                      />
                    </div>
                    <div>
                      <label class="form-label" for="login-password">Contraseña</label>
                      <input
                        class="form-control app-input"
                        id="login-password"
                        type="password"
                        autocomplete="current-password"
                      />
                    </div>
                    <div class="form-feedback" id="login-feedback" aria-live="polite"></div>
                    <button class="btn btn-primary app-btn-primary w-100" type="submit">Ingresar</button>
                  </form>
                </section>

                <section id="register-panel" class="d-none" role="tabpanel" aria-labelledby="auth-register-toggle">
                  <form class="auth-form" id="register-form" novalidate>
                    <div>
                      <label class="form-label" for="register-name">Nombre</label>
                      <input
                        class="form-control app-input"
                        id="register-name"
                        type="text"
                        autocomplete="name"
                        maxlength="60"
                      />
                    </div>
                    <div>
                      <label class="form-label" for="register-email">Correo</label>
                      <input
                        class="form-control app-input"
                        id="register-email"
                        type="email"
                        autocomplete="email"
                        placeholder="correo@ejemplo.com"
                      />
                    </div>
                    <div>
                      <label class="form-label" for="register-password">Contraseña</label>
                      <input
                        class="form-control app-input"
                        id="register-password"
                        type="password"
                        autocomplete="new-password"
                      />
                    </div>
                    <div>
                      <label class="form-label" for="register-confirm">Confirmar contraseña</label>
                      <input
                        class="form-control app-input"
                        id="register-confirm"
                        type="password"
                        autocomplete="new-password"
                      />
                    </div>
                    <div class="form-feedback" id="register-feedback" aria-live="polite"></div>
                    <button class="btn btn-primary app-btn-primary w-100" type="submit">Crear cuenta</button>
                  </form>
                </section>
              </article>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="cart-modal" data-cart-modal aria-hidden="true">
      <div class="cart-modal-backdrop" data-cart-close></div>
      <section class="cart-panel" data-cart-panel role="dialog" aria-modal="true" aria-labelledby="cart-title" tabindex="-1">
        <div class="cart-panel-header">
          <div>
            <span class="section-tag">Pedido retro</span>
            <h2 class="cart-title" id="cart-title">Tu carrito</h2>
          </div>
          <button class="cart-close-button" type="button" data-cart-close aria-label="Cerrar carrito">&times;</button>
        </div>
        <div class="cart-content" data-cart-content></div>
      </section>
    </div>

    <script src="js/data/movies.data.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/helpers.js"></script>
    <script src="js/services/movie.service.js"></script>
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/cart.service.js"></script>
    <script src="js/pages/auth.page.js"></script>
    <script src="js/core/cart.modal.js"></script>
  </body>
</html>
