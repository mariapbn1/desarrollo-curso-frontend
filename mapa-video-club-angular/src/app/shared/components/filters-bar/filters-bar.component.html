<section class="filter-section" aria-label="Filtros de peliculas">
  <div class="filters-panel">
    <span class="section-tag">Filtros</span>

    <form class="filters-grid">
      <label>
        <span>Buscar</span>
        <input
          type="search"
          placeholder="Titulo"
          [value]="filters.search ?? ''"
          (input)="updateFilter('search', $event)"
        />
      </label>

      <label>
        <span>Genero</span>
        <select [value]="filters.genre ?? ''" (change)="updateFilter('genre', $event)">
          <option value="">Todos</option>
          @for (genre of genres; track genre) {
            <option [value]="genre">{{ genre }}</option>
          }
        </select>
      </label>

      <label>
        <span>Anio</span>
        <select [value]="filters.year ?? ''" (change)="updateFilter('year', $event)">
          <option value="">Todos</option>
          @for (year of years; track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      </label>

      <label>
        <span>Rating</span>
        <select [value]="filters.rating ?? ''" (change)="updateFilter('rating', $event)">
          <option value="">Todos</option>
          <option value="8">8+</option>
          <option value="7">7+</option>
          <option value="6">6+</option>
        </select>
      </label>

      <label>
        <span>Formato</span>
        <select [value]="filters.format ?? ''" (change)="updateFilter('format', $event)">
          <option value="">Todos</option>
          @for (format of formats; track format) {
            <option [value]="format">{{ format }}</option>
          }
        </select>
      </label>

      <button class="app-btn-secondary" type="button" (click)="clearFilters()">Limpiar</button>
    </form>
  </div>
</section>
