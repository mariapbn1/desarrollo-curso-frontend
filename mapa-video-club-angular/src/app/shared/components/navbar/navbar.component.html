<nav class="app-navbar" aria-label="Principal">
  <a class="brand-mark" routerLink="/" aria-label="Ir al inicio">
    <img class="brand-logo" src="assets/img/logo-mapa-video-club.png" alt="MAPA VIDEO CLUB" />
  </a>

  <div class="navbar-actions">
    <a class="nav-text-link" routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </a>
    <a class="nav-text-link" routerLink="/contacto" routerLinkActive="is-active">Contacto</a>
    @if (currentUser()) {
      <a class="nav-icon-link" routerLink="/" [queryParams]="{ view: 'favorites' }" aria-label="Favoritos">
        <img class="nav-icon-img" src="assets/img/icons/icon-favorite-neon.png" alt="Favoritos" />
      </a>
    }
    <button class="nav-icon-link cart-nav-button" type="button" aria-label="Carrito" (click)="openCart()">
      <img class="nav-icon-img" src="assets/img/icons/icon-cart-neon.png" alt="Carrito" />
      @if (cartCount() > 0) {
        <span class="cart-count-badge">{{ cartCount() }}</span>
      }
    </button>

    @if (currentUser(); as user) {
      <span class="auth-user">
        <img class="nav-icon-img" src="assets/img/icons/icon-user-neon.png" alt="" />
        <span>Hola, {{ user.name }}</span>
      </span>
      <button class="nav-text-link auth-logout-button" type="button" (click)="logout()">Salir</button>
    } @else {
      <a class="auth-login-link" routerLink="/auth" routerLinkActive="is-active" aria-label="Ingresar">
        <img class="nav-icon-img" src="assets/img/icons/icon-user-neon.png" alt="" />
        <span>Ingresar</span>
      </a>
    }
  </div>
</nav>

<app-cart-modal [isOpen]="isCartOpen" (closed)="closeCart()" />
